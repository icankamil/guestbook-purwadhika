services:
  # Database PostgreSQL
  db:
    image: postgres:16-alpine
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: guestbook_rest

  # Backend Express
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - '4000:4000'
    depends_on:
      - db
    environment:
      DATABASE_URL: 'postgresql://user:password@db:5432/guestbook_rest'
      PORT: 4000

  # Frontend Next.js
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    ports:
      - '3000:3000'
    depends_on:
      - backend
    environment:
      INTERNAL_API_URL: 'http://backend:4000'
      NEXT_PUBLIC_API_URL: '/api'
      PORT: 3000

volumes:
  postgres_data: